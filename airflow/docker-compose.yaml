# Local Airflow (LocalExecutor + Postgres). From this folder:
#   cp ../.env.example ../.env   # then fill it in
#   docker compose up airflow-init && docker compose up -d
# UI: http://localhost:8080  (user: admin / password: admin)
x-airflow-common: &airflow-common
  build: .
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow/include
    ATHENA_SQL_DIR: /opt/airflow/athena
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ../athena:/opt/airflow/athena:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
        # Rate-limit guard shared by the daily DAG and the backfill DAG (2 concurrent API calls)
        airflow pools set open_meteo_api 2 "Open-Meteo free tier: be polite"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-data:
